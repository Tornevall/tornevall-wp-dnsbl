name: PHP checks

on:
  pull_request:
  push:
    branches:
      - master
      - '3.1'
      - '3.2'

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'
          - '8.5'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify referenced plugin files
        run: php tests/required-files.php

      - name: Run commerce fraud runtime tests
        run: php tests/runtime-commerce-fraud.php

      - name: Run gateway-neutral WooCommerce tests
        run: php tests/runtime-woocommerce-gateways.php
