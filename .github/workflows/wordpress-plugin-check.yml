name: WordPress Plugin Check

on:
  pull_request:
    # Keep CI active for the default branch and both maintained release lines.
    branches:
      - master
      - '3.1'
      - '3.2'
  push:
    # Validate direct updates to the same maintained branches as well.
    branches:
      - master
      - '3.1'
      - '3.2'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './'
          slug: tornevall-networks-dnsbl-implementation
          exclude-files: '.gitignore'
          exclude-directories: '.github'
          strict: false
